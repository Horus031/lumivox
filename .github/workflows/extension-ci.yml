name: Extension CI

on:
  pull_request:
    branches:
      - product-release
      - main
    paths:
      - "apps/extension/**"
      - ".github/workflows/extension-ci.yml"

  push:
    branches:
      - product-release
      - main
    paths:
      - "apps/extension/**"
      - ".github/workflows/extension-ci.yml"

permissions:
  contents: read

jobs:
  extension:
    name: Extension Typecheck, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build production extension
        run: npm run build

      - name: Verify Manifest V3
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const m = JSON.parse(
              fs.readFileSync('dist/manifest.json', 'utf8')
            );
            if (m.manifest_version !== 3) {
              throw new Error('Expected Manifest V3');
            }
            if (m.permissions.join(',') !== 'activeTab') {
              throw new Error('Unexpected permissions');
            }
            if (!m.background?.service_worker) {
              throw new Error('Missing service worker');
            }
            console.log('Extension manifest verified');
          "

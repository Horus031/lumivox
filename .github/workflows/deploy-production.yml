name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production · Database and Services
    if: >
      vars.PRODUCTION_CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.WEB_URL }}

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      WEB_URL: ${{ vars.WEB_URL }}
      AI_API_URL: ${{ vars.AI_API_URL }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release bindings before database changes
        run: |
          test "$SUPABASE_PROJECT_ID" = lslybjylsxtnznghrtyj
          case "${WEB_URL%/}" in
            https://www.lumivox.it.com|https://lumivox.it.com) ;;
            *) echo "::error::Unexpected Production Web URL."; exit 1 ;;
          esac
          test "${AI_API_URL%/}" = https://lumivox-ai-api.onrender.com
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          if [[ "$RENDER_DEPLOY_HOOK" != https://api.render.com/deploy/srv-d87k12rtqb8s73c0ih10?key=* ]]; then
            echo "::error::Render hook must target the approved Production service."
            exit 1
          fi
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$EXPECTED_SHA" ]]; then
            echo "::error::CI result is no longer the current main commit. Refusing a stale release."
            exit 1
          fi
          node scripts/ci/production-vercel-release.mjs preflight

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.122.0"

      - name: Link production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview production migrations
        run: supabase db push --linked --dry-run

      - name: Apply production migrations
        run: supabase db push --linked

      - name: Trigger Render production deployment
        run: |
          curl --fail --silent --output /dev/null --max-time 60 --request POST \
            "${RENDER_DEPLOY_HOOK}&ref=${EXPECTED_SHA}"

      - name: Wait for AI API production revision and model
        run: |
          expected_model_version="$(jq -r '.model_version' services/ai-api/ml/artifacts/native-task-risk/logistic_regression_balanced_metadata.json)"
          bash scripts/ci/wait-for-revision.sh \
            "${AI_API_URL%/}/api/v1/health" \
            "$EXPECTED_SHA" \
            900 \
            "$expected_model_version"

      - name: Deploy Vercel at the tested SHA after AI readiness
        run: node scripts/ci/production-vercel-release.mjs deploy

      - name: Wait for web production revision
        run: |
          bash scripts/ci/wait-for-revision.sh \
            "${WEB_URL%/}/api/health" \
            "$EXPECTED_SHA" \
            900

      - name: Production smoke checks
        run: |
          for url in \
            "${AI_API_URL%/}/api/v1/health" \
            "${WEB_URL%/}/api/health" \
            "${WEB_URL%/}/"
          do
            echo "Smoke check: $url"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 3 \
              --retry-max-time 120 \
              "$url" >/dev/null
          done

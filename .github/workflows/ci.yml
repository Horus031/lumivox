name: CI

on:
  pull_request:
    branches:
      - product-release
      - main
  push:
    branches:
      - product-release
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web · Lint, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10

    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      AI_API_BASE_URL: http://127.0.0.1:8000
      AI_INTERNAL_API_KEY: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      LIVEKIT_URL: wss://example.livekit.cloud
      LIVEKIT_API_KEY: ci-placeholder
      LIVEKIT_API_SECRET: ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Production release safeguards
        working-directory: .
        run: node --test scripts/ci/production-safeguards.test.mjs

      - name: Unit tests
        env:
          RAG_TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: npm run test:unit

      - name: TypeScript typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Production build
        run: npm run build

  ai-api:
    name: AI API · Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10

    defaults:
      run:
        working-directory: services/ai-api

    env:
      APP_ENV: test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder
      AI_INTERNAL_API_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
      GROQ_API_KEY: ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: services/ai-api/.python-version
          cache: pip
          cache-dependency-path: |
            services/ai-api/requirements.txt
            services/ai-api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q app scripts evaluation

      - name: Audit pinned Python runtime dependencies
        run: |
          python -m pip check
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install 'pip-audit==2.10.0'
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit --disable-pip --no-deps -r requirements.txt

      - name: Verify native task risk artifact
        run: python scripts/verify_native_task_risk_artifact.py

      - name: Unit tests
        run: python -m pytest -q

      - name: RAG context quality regression
        run: python -m scripts.verify_rag_context_quality --dataset evaluation/context_quality_v1.jsonl --variant adaptive --mode offline --strict

      - name: RAG security regression
        run: python -m scripts.verify_rag_security --dataset evaluation/security_adversarial_v1.jsonl

      - name: RAG comparative offline evaluation
        run: |
          for variant in A B C D; do
            python -m scripts.verify_rag_comparative --variant "$variant" --mode offline --output "$RUNNER_TEMP/rag-$variant-offline.jsonl" || exit 1
          done

      - name: RAG provider concurrency against Redis
        run: python -m scripts.verify_rag_resource_control

  database:
    name: Supabase · Migration Replay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required migrations are committed
        run: bash scripts/ci/check-migration-coverage.sh

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.122.0"

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Replay migrations from a clean database
        run: supabase db reset --local

      - name: Database tests
        run: supabase test db --local

      - name: RAG conversation concurrency
        run: node scripts/test-rag-conversation-concurrency.mjs

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

name: Task Risk Recovery Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-risk-recovery-monitor-staging
  cancel-in-progress: false

jobs:
  monitor:
    name: Staging · Task Risk Recovery health
    if: vars.TASK_RISK_MONITOR_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Staging recovery health
        env:
          PGHOST: ${{ vars.TASK_RISK_MONITOR_PGHOST }}
          PGPORT: ${{ vars.TASK_RISK_MONITOR_PGPORT || '5432' }}
          PGDATABASE: postgres
          PGUSER: ${{ secrets.TASK_RISK_MONITOR_PGUSER }}
          PGPASSWORD: ${{ secrets.TASK_RISK_MONITOR_PGPASSWORD }}
          TASK_RISK_MONITOR_CA_PEM: ${{ secrets.TASK_RISK_MONITOR_CA_PEM }}
          PGSSLMODE: verify-full
        run: |
          if [[ "$PGHOST" != db.atbdbbamqjmfkvahqidj.supabase.co ]]; then
            if [[ "$PGHOST" != *.pooler.supabase.com || "$PGUSER" != *.atbdbbamqjmfkvahqidj ]]; then
              echo "::error::The monitor must target the verified Supabase Staging project."
              exit 2
            fi
          fi
          if [[ -z "$PGUSER" || -z "$PGPASSWORD" || -z "$TASK_RISK_MONITOR_CA_PEM" ]]; then
            echo "::error::Configure the Staging read-only monitor credentials and TLS CA."
            exit 2
          fi
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          umask 077
          PGSSLROOTCERT="$(mktemp)"
          export PGSSLROOTCERT
          trap 'rm -f -- "$PGSSLROOTCERT"' EXIT
          printf '%s\n' "$TASK_RISK_MONITOR_CA_PEM" > "$PGSSLROOTCERT"
          set +e
          node scripts/check-task-risk-recovery-health.mjs > "$RUNNER_TEMP/task-risk-health.json"
          status=$?
          set -e
          {
            echo "## Task Risk Recovery health · Staging"
            if [[ -s "$RUNNER_TEMP/task-risk-health.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/task-risk-health.json"
              echo '```'
            else
              echo "Health probe did not return a snapshot."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == 1 ]]; then
            echo "::error::Task Risk Recovery raised an operational alert. See the job summary."
          elif [[ "$status" != 0 ]]; then
            echo "::error::Task Risk Recovery health probe is unavailable."
          fi
          exit "$status"
